peer:
  id: peer0.grambank.com
  networkId: dev
  listenAddress: 0.0.0.0:7051
  address: peer0.grambank.com:7051
  addressAutoDetect: false
  gossip:
    bootstrap: peer0.grambank.com:7051
    useLeaderElection: true
    orgLeader: false
    externalEndpoint: peer0.grambank.com:7051
    skipBlockVerification: false
    dialTimeout: 10s
    connTimeout: 3s
    recvBuffSize: 20
    sendBuffSize: 200
    gossipTimeLimit: 10s
    publishTimeLimit: 10s
    maxRetCount: 3
    maxPropagationBurstSize: 10
    maxPropagationBurstLatency: 10ms
    propagatePeerNum: 3
    pullInterval: 4s
    pullPeerNum: 3
    requestStateInfoInterval: 4s
    publishStateInfoInterval: 4s
    publishCertPeriod: 10s
    decodeBuffSize: 500
    election:
      startupGracePeriod: 15s
      membershipSampleInterval: 1s
      leaderAliveThreshold: 10s
      leaderElectionDuration: 5s
  tls:
    enabled: true
    cert:
      file: /etc/hyperledger/fabric/peerOrganizations/grambank.com/peers/peer0.grambank.com/tls/server.crt
    key:
      file: /etc/hyperledger/fabric/peerOrganizations/grambank.com/peers/peer0.grambank.com/tls/server.key
    rootcert:
      file: /etc/hyperledger/fabric/peerOrganizations/grambank.com/peers/peer0.grambank.com/tls/ca.crt
    clientAuthRequired: false
    clientRootCAs:
      files: []
  authentication:
    timewindow: 15m
  fileSystemPath: /var/hyperledger/production
  BCCSP:
    Default: SW
    SW:
      Hash: SHA2
      Security: 256
  mspConfigPath: /etc/hyperledger/fabric/peerOrganizations/grambank.com/msp
  localMspId: GramBankMSP
  profile:
    enabled: false
    listenAddress: 0.0.0.0:6060
  adminService:
  deliveryClient:
    reConnectTotalTimeThreshold: 3600s
    reConnectBackoffThreshold: 3600s
    addressOverrides: []
  localMspType: bccsp
  discovery:
    enabled: true
    authCacheEnabled: true
    authCacheMaxSize: 1000
    authCacheTTL: 300s
    authCachePurgeRetentionRatio: 0.75
    orgMembersAllowedAccess: false

vm:
  endpoint: unix:///var/run/docker.sock
  docker:
    tls:
      enabled: false
    attachStdOut: false
    hostConfig:
      NetworkMode: host
      LogConfig:
        Type: json-file
        Config:
          max-size: "50m"
          max-file: "5"
      Memory: 2147483648

chaincode:
  builder: hyperledger/fabric-ccenv:2.5
  pull: true
  golang:
    runtime: hyperledger/fabric-baseos:amd64-2.5
  node:
    runtime: hyperledger/fabric-nodeenv:2.5
  java:
    runtime: hyperledger/fabric-javaenv:2.5
  startuptimeout: 300s
  executetimeout: 30s
  mode: net
  keepalive: 0
  system:
    _lifecycle: enable
    cscc: enable
    lscc: enable
    qscc: enable
  logging:
    level: info
    shim: warning
    format: '%{color}%{time:2006-01-02 15:04:05.000 MST} [%{module}] %{shortfunc} -> %{level:.4s} %{id:03x}%{color:reset} %{message}'

ledger:
  state:
    stateDatabase: goleveldb
    totalQueryLimit: 10000
  history:
    enableHistoryDatabase: true

operations:
  listenAddress: 0.0.0.0:9443
  tls:
    enabled: false
    clientAuthRequired: false
    cert:
      file:
    key:
      file:
    clientRootCAs:
      files: []
    rootcert:
      file:
