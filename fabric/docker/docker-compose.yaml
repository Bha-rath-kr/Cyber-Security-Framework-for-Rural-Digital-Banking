# version: '3'
# version: "3.8"

networks:
  grambank:
    driver: bridge

services:

  # ---------------------------------------------------------------
  # Certificate Authority
  # ---------------------------------------------------------------
  ca.grambank.com:
    image: hyperledger/fabric-ca:1.5
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-grambank
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_CSR_CN=ca-grambank
      - FABRIC_CA_SERVER_CSR_HOSTS=ca.grambank.com
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    networks:
      - grambank

  # ---------------------------------------------------------------
  # Orderer
  # ---------------------------------------------------------------
  orderer.grambank.com:
    image: hyperledger/fabric-orderer:2.5
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports:
      - "7050:7050"
    volumes:
      - ../configtx/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ../crypto-config/ordererOrganizations/grambank.com/orderers/orderer.grambank.com/msp:/var/hyperledger/orderer/msp
      - ../crypto-config/ordererOrganizations/grambank.com/orderers/orderer.grambank.com/tls:/var/hyperledger/orderer/tls
    networks:
      - grambank

  # ---------------------------------------------------------------
  # Peer
  # ---------------------------------------------------------------
  peer0.grambank.com:
    image: hyperledger/fabric-peer:2.5
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.grambank.com
      - CORE_PEER_ADDRESS=peer0.grambank.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.grambank.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.grambank.com:7051
      - CORE_PEER_LOCALMSPID=GramBankMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=docker_grambank
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.grambank.com:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    ports:
      - "7051:7051"
      - "7052:7052"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../crypto-config/peerOrganizations/grambank.com/peers/peer0.grambank.com/msp:/etc/hyperledger/fabric/msp
      - ../crypto-config/peerOrganizations/grambank.com/peers/peer0.grambank.com/tls:/etc/hyperledger/fabric/tls
    depends_on:
      - couchdb.grambank.com
      - orderer.grambank.com
    networks:
      - grambank

  # ---------------------------------------------------------------
  # CouchDB (world state database for the peer)
  # ---------------------------------------------------------------
  couchdb.grambank.com:
    image: couchdb:3.3
    labels:
      service: hyperledger-fabric
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    networks:
      - grambank

  # ---------------------------------------------------------------
  # CLI (admin tools for channel + chaincode operations)
  # ---------------------------------------------------------------
  cli.grambank.com:
    image: hyperledger/fabric-tools:2.5
    labels:
      service: hyperledger-fabric
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric/config
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.grambank.com:7051
      - CORE_PEER_LOCALMSPID=GramBankMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/peerOrganizations/grambank.com/peers/peer0.grambank.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/peerOrganizations/grambank.com/users/Admin@grambank.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../crypto-config:/etc/hyperledger/fabric
      - ../config:/etc/hyperledger/fabric/config
      - ../chaincode:/opt/gopath/src/github.com/chaincode
      - ../configtx:/etc/hyperledger/configtx
    depends_on:
      - peer0.grambank.com
      - orderer.grambank.com
    networks:
      - grambank
